name: README Pages + PDF

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - tools/readme-pages/**
      - .github/workflows/readme-pages.yml
      - assets/**
  workflow_dispatch:

concurrency:
  group: readme-pages
  cancel-in-progress: true

jobs:
  build-pages:
    name: Build README Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/readme-pages/package-lock.json

      - name: Install README tooling dependencies
        working-directory: tools/readme-pages
        run: npm ci

      - name: Build README site
        working-directory: tools/readme-pages
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site


  deploy-pages:
    name: Deploy GitHub Pages
    needs:
      - build-pages

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4


  generate-pdf:
    name: Generate PDF from built site
    needs:
      - build-pages

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/readme-pages/package-lock.json

      - name: Install README tooling dependencies
        working-directory: tools/readme-pages
        run: npm ci

      - name: Build README site
        working-directory: tools/readme-pages
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: tools/readme-pages
        run: npx playwright install --with-deps chromium

      - name: Generate PDF from built site
        working-directory: tools/readme-pages
        run: npm run pdf

      - name: Verify PDF
        shell: bash
        run: |
          set -euo pipefail

          test -s artifacts/cv.pdf

          echo "Generated PDF:"
          ls -lh artifacts/cv.pdf

      - name: Publish PDF to persistent GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="cv"
          PDF_PATH="artifacts/cv.pdf"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload \
              "$RELEASE_TAG" \
              "$PDF_PATH" \
              --clobber
          else
            gh release create \
              "$RELEASE_TAG" \
              "$PDF_PATH" \
              --title "CV" \
              --notes "Automatically generated from the locally-built README site (build.mjs)." \
              --target "${GITHUB_SHA}" \
              --latest=false
          fi
