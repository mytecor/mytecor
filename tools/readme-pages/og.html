<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 60%, #1c2333 100%);
      color: #e6edf3;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      padding: 0 96px;
    }

    .name {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: #ffffff;
    }

    .role {
      margin-top: 20px;
      font-size: 32px;
      font-weight: 500;
      color: #7ee0b0;
    }

    .divider {
      width: 96px;
      height: 4px;
      margin: 36px 0;
      border-radius: 2px;
      background: linear-gradient(90deg, #2f81f7, #7ee0b0);
    }

    .tagline {
      font-size: 26px;
      font-weight: 400;
      color: #9198a1;
      line-height: 1.5;
    }

    .domain {
      margin-top: 48px;
      font-size: 26px;
      color: #2f81f7;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">Vladislav Afonin</div>
    <div class="role">Software Engineer</div>
    <div class="divider"></div>
    <div class="tagline">Distributed Systems · Developer Infrastructure · AI Tooling</div>
    <div class="domain">myt.su</div>
  </div>
</body>
</html>
